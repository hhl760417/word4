<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>快速背单词</title>
    <style>
        /* 默认白天模式 (Light Mode) */
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --warning-color: #f39c12;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-secondary: #555555;
            --border-color: #e1e8ed;
            --option-bg: #ffffff;
            --score-bg: #f0f4f8;
            --modal-header-border: #eeeeee;
            --sub-text: #a0aec0;
        }

        /* 夜间模式 (Dark Mode) */
        [data-theme="dark"] {
            --primary-color: #5b9bd5;
            --success-color: #27ae60;
            --error-color: #c0392b;
            --warning-color: #d35400;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
            --option-bg: #2a2a2a;
            --score-bg: #252525;
            --modal-header-border: #333333;
            --sub-text: #777777;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            padding-top: calc(12px + env(safe-area-inset-top));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--text-color);
            margin: 0;
            font-size: clamp(18px, 5vw, 22px);
        }

        .settings-btn {
            background-color: var(--score-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        @media (min-width: 480px) {
            .modal-overlay {
                align-items: center;
            }
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            .modal {
                border-radius: 12px;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--modal-header-border);
            padding-bottom: 8px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 17px;
            color: var(--text-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--sub-text);
            padding: 0 8px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        select, button.control-btn {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--option-bg);
            color: var(--text-color);
            height: 42px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-wrong-notebook {
            background-color: rgba(231, 76, 60, 0.15);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            border-radius: 8px;
            padding: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            flex: 2;
            height: 42px;
        }

        .btn-clear-wrong {
            background-color: var(--option-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            height: 42px;
        }

        .btn-clear-cache {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
            border: 1px dashed var(--error-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            height: 42px;
        }

        .score-board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: var(--score-bg);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-weight: bold;
            font-size: 12px;
        }

        .score-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
        }

        .score-row-title {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 2px;
            text-align: center;
        }

        .clickable-title {
            cursor: pointer;
            color: var(--primary-color);
            text-decoration: underline;
            text-underline-offset: 2px;
            user-select: none;
        }

        .score-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 1px 0;
        }

        .score-item { text-align: center; }
        .score-total-dict { color: var(--primary-color); }
        .score-mastered { color: var(--success-color); }
        .score-remaining { color: var(--warning-color); }
        .score-correct { color: var(--success-color); }
        .score-wrong { color: var(--error-color); }
        .score-total { color: var(--primary-color); }

        .card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 12px;
            text-align: center;
            margin-bottom: 14px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            background-color: var(--card-bg);
        }

        .word-text {
            font-size: clamp(20px, 6vw, 32px);
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 6px;
            word-break: break-word;
            line-height: 1.3;
        }

        .long-press-tip {
            font-size: 10px;
            color: var(--sub-text);
            position: absolute;
            bottom: 4px;
        }

        .speak-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary-color);
            padding: 4px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-btn {
            padding: 12px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            background-color: var(--option-bg);
            color: var(--text-color);
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }

        .option-btn.correct {
            background-color: var(--success-color) !important;
            color: white !important;
            border-color: var(--success-color) !important;
        }

        .option-btn.wrong {
            background-color: var(--error-color) !important;
            color: white !important;
            border-color: var(--error-color) !important;
        }

        .bottom-btn-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .action-btn {
            width: 100%;
            height: 48px;
            font-size: 16px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .next-btn { background-color: var(--primary-color); }
        .pause-btn { background-color: var(--warning-color); box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3); }
        .modal-footer { margin-top: 12px; text-align: right; }

        .word-detail-body {
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-color);
            line-height: 1.5;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .detail-section {
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .detail-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
            font-size: 14px;
        }

        .phonetic-tag {
            display: inline-block;
            background: var(--score-bg);
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 6px;
        }

        .trans-item { margin-bottom: 4px; }

        .pos-badge {
            display: inline-block;
            font-weight: bold;
            color: #e67e22;
            min-width: 38px;
        }

        .example-item, .phrase-item {
            background-color: var(--score-bg);
            border-left: 3px solid var(--primary-color);
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: 0 4px 4px 0;
            font-size: 12px;
        }

        .example-en, .phrase-en { font-weight: 500; color: var(--text-color); }
        .example-cn, .phrase-cn { color: var(--text-secondary); margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1 id="appTitle">快速背单词</h1>
        <button class="settings-btn" id="openModalBtn">⚙️ 设置</button>
    </div>

    <!-- 统计看板 -->
    <div class="score-board">
        <!-- 第一行：词库总体数据 (支持点击手工设定已掌握数) -->
        <div class="score-row-title clickable-title" id="dictTitleLabel">词库总体 (点击设定初始已掌握数)</div>
        <div class="score-row">
            <div class="score-item">总词条: <span id="dictTotalCount" class="score-total-dict">0</span></div>
            <div class="score-item">已掌握: <span id="masteredCount" class="score-mastered">0</span></div>
            <div class="score-item">剩余: <span id="remainingCount" class="score-remaining">0</span></div>
        </div>
        
        <div class="score-divider"></div>
        
        <!-- 第二行：当前分组数据 (支持点击切换) -->
        <div class="score-row-title clickable-title" id="groupTitleLabel">当前分组</div>
        <div class="score-row">
            <div class="score-item">组词条: <span id="groupTotalCount" class="score-total-dict">0</span></div>
            <div class="score-item">组已掌握: <span id="groupMasteredCount" class="score-mastered">0</span></div>
            <div class="score-item">组剩余: <span id="groupRemainingCount" class="score-remaining">0</span></div>
        </div>

        <div class="score-divider"></div>

        <!-- 第三行：当前答题情况 -->
        <div class="score-row">
            <div class="score-item">正确: <span id="correctCount" class="score-correct">0</span></div>
            <div class="score-item">错误: <span id="wrongCount" class="score-wrong">0</span></div>
            <div class="score-item">答题总计: <span id="totalCount" class="score-total">0</span></div>
        </div>
    </div>

    <div class="card" id="wordCard">
        <div id="wordText" class="word-text">正在加载...</div>
        <button id="speakBtn" class="speak-btn" title="朗读">🔊</button>
        <span class="long-press-tip">长按查看详细解析</span>
    </div>

    <div class="options-grid" id="optionsContainer">
        <button class="option-btn" onclick="checkAnswer(0)"></button>
        <button class="option-btn" onclick="checkAnswer(1)"></button>
        <button class="option-btn" onclick="checkAnswer(2)"></button>
        <button class="option-btn" onclick="checkAnswer(3)"></button>
    </div>

    <div class="bottom-btn-container">
        <button id="nextBtn" class="action-btn next-btn" onclick="nextWord()" style="display: none;">下一题</button>
        <button id="pauseBtn" class="action-btn pause-btn" onclick="togglePause()">暂停</button>
    </div>
</div>

<!-- 设置弹出窗口 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2>设置选项</h2>
            <button class="close-btn" id="closeModalBtn">✕</button>
        </div>

        <div class="controls">
            <!-- 主题切换设置 -->
            <div class="control-group">
                <label for="themeSelect">主题模式：</label>
                <select id="themeSelect">
                    <option value="light">☀️ 浅色模式（白天）</option>
                    <option value="dark">🌙 深色模式（夜间）</option>
                </select>
            </div>

            <div class="control-group">
                <label for="fileSelect">选择词库文件：</label>
                <select id="fileSelect">
                    <option value="">正在获取词库列表...</option>
                </select>
            </div>

            <!-- 分组设置 -->
            <div class="control-group">
                <label for="groupSizeSelect">每组单词数量：</label>
                <select id="groupSizeSelect">
                    <option value="10">每组 10 个</option>
                    <option value="20" selected>每组 20 个</option>
                    <option value="50">每组 50 个</option>
                    <option value="all">不分组（全部加载）</option>
                </select>
            </div>

            <!-- 学习方式设置 -->
            <div class="control-group">
                <label for="studyModeSelect">学习方式：</label>
                <select id="studyModeSelect">
                    <option value="en2cn" selected>英译中（看着英文选中文）</option>
                    <option value="cn2en">中译英（看着中文选英文）</option>
                </select>
            </div>

            <!-- 英译中错题本管理 -->
            <div class="control-group">
                <label>英译中错题本：</label>
                <div class="btn-group">
                    <button id="loadWrongEn2CnBtn" class="btn-wrong-notebook">📖 练习英译中错题 (<span id="wrongCountEn2CnBadge">0</span>)</button>
                    <button id="clearWrongEn2CnBtn" class="btn-clear-wrong">清空</button>
                </div>
            </div>

            <!-- 中译英错题本管理 -->
            <div class="control-group">
                <label>中译英错题本：</label>
                <div class="btn-group">
                    <button id="loadWrongCn2EnBtn" class="btn-wrong-notebook">📖 练习中译英错题 (<span id="wrongCountCn2EnBadge">0</span>)</button>
                    <button id="clearWrongCn2EnBtn" class="btn-clear-wrong">清空</button>
                </div>
            </div>

            <div class="control-group">
                <label for="orderSelect">单词显示顺序：</label>
                <select id="orderSelect">
                    <option value="random">随机显示</option>
                    <option value="sequence">顺序显示</option>
                </select>
            </div>

            <!-- 选项文字字号设置 -->
            <div class="control-group">
                <label for="fontSizeSelect">选项文字字号：</label>
                <select id="fontSizeSelect">
                    <option value="12px">超小 (12px)</option>
                    <option value="14px" selected>默认 (14px)</option>
                    <option value="16px">中等 (16px)</option>
                    <option value="18px">较大 (18px)</option>
                    <option value="20px">特大 (20px)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="repeatSelect">朗读次数：</label>
                <select id="repeatSelect">
                    <option value="1">1 次</option>
                    <option value="2">2 次</option>
                    <option value="3">3 次</option>
                </select>
            </div>

            <div class="control-group">
                <label for="modeSelect">切换模式：</label>
                <select id="modeSelect">
                    <option value="manual">手动切换</option>
                    <option value="auto" selected>答题后自动切换</option>
                    <option value="fast">快速切换 (限时未答算错)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="intervalSelect">朗读后间隔时间：</label>
                <select id="intervalSelect">
                    <option value="1000" selected>1 秒</option>
                    <option value="3000">3 秒</option>
                    <option value="5000">5 秒</option>
                </select>
            </div>

            <!-- 清除缓存 -->
            <div class="control-group" style="margin-top: 6px;">
                <label>系统数据管理：</label>
                <button id="clearCacheBtn" class="btn-clear-cache">🗑️ 清除所有本地缓存</button>
            </div>
        </div>

        <div class="modal-footer">
            <button class="action-btn next-btn" id="saveModalBtn" style="height: 40px; border-radius: 8px;">完成</button>
        </div>
    </div>
</div>

<!-- 单词详情弹出窗口 -->
<div class="modal-overlay" id="detailModalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="detailWordTitle">单词详解</h2>
            <button class="close-btn" id="closeDetailModalBtn">✕</button>
        </div>

        <div class="word-detail-body" id="detailModalBody"></div>

        <div class="modal-footer">
            <button class="action-btn next-btn" id="closeDetailBtn" style="height: 40px; border-radius: 8px;">关闭</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_API_URL = "https://api.github.com/repos/hhl760417/english-vocabulary/contents/json_original/json-full";
    const CDN_BASE_URL = "https://cdn.jsdelivr.net/gh/hhl760417/english-vocabulary@master/json_original/json-full/";

    let fullVocabulary = []; 
    let currentGroupList = []; 
    let vocabulary = []; 
    
    let wrongWordsEn2Cn = [];
    let wrongWordsCn2En = [];
    
    let wordStatsMap = {}; 
    let isWrongMode = false;

    let currentGroupIndex = 0; 
    let studyMode = 'en2cn'; 

    let currentWordObj = null;
    let correctIndex = -1;
    let answered = false;
    let isPaused = false;
    let autoTimer = null;
    let sequenceIndex = 0;
    let longPressTimer = null;

    let stats = { correct: 0, wrong: 0, total: 0 };

    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');

    const detailModalOverlay = document.getElementById('detailModalOverlay');
    const closeDetailModalBtn = document.getElementById('closeDetailModalBtn');
    const closeDetailBtn = document.getElementById('closeDetailBtn');
    const detailWordTitle = document.getElementById('detailWordTitle');
    const detailModalBody = document.getElementById('detailModalBody');

    const themeSelect = document.getElementById('themeSelect');
    const fileSelect = document.getElementById('fileSelect');
    const groupSizeSelect = document.getElementById('groupSizeSelect');
    const studyModeSelect = document.getElementById('studyModeSelect');
    const orderSelect = document.getElementById('orderSelect');
    const fontSizeSelect = document.getElementById('fontSizeSelect');
    const repeatSelect = document.getElementById('repeatSelect');
    const modeSelect = document.getElementById('modeSelect');
    const intervalSelect = document.getElementById('intervalSelect');
    
    const loadWrongEn2CnBtn = document.getElementById('loadWrongEn2CnBtn');
    const clearWrongEn2CnBtn = document.getElementById('clearWrongEn2CnBtn');
    const loadWrongCn2EnBtn = document.getElementById('loadWrongCn2EnBtn');
    const clearWrongCn2EnBtn = document.getElementById('clearWrongCn2EnBtn');
    
    const clearCacheBtn = document.getElementById('clearCacheBtn');
    const wrongCountEn2CnBadge = document.getElementById('wrongCountEn2CnBadge');
    const wrongCountCn2EnBadge = document.getElementById('wrongCountCn2EnBadge');
    const appTitle = document.getElementById('appTitle');

    const wordCard = document.getElementById('wordCard');
    const wordText = document.getElementById('wordText');
    const speakBtn = document.getElementById('speakBtn');
    const optionBtns = document.querySelectorAll('.option-btn');
    const nextBtn = document.getElementById('nextBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const dictTitleLabel = document.getElementById('dictTitleLabel');
    const groupTitleLabel = document.getElementById('groupTitleLabel');
    const dictTotalCountEl = document.getElementById('dictTotalCount');
    const masteredCountEl = document.getElementById('masteredCount');
    const remainingCountEl = document.getElementById('remainingCount');
    
    const groupTotalCountEl = document.getElementById('groupTotalCount');
    const groupMasteredCountEl = document.getElementById('groupMasteredCount');
    const groupRemainingCountEl = document.getElementById('groupRemainingCount');

    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const totalCountEl = document.getElementById('totalCount');

    function initTheme() {
        const savedTheme = localStorage.getItem('app_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeSelect.value = savedTheme;
    }

    function initFontSize() {
        const savedSize = localStorage.getItem('app_option_font_size') || '14px';
        fontSizeSelect.value = savedSize;
        applyOptionFontSize(savedSize);
    }

    function applyOptionFontSize(size) {
        optionBtns.forEach(btn => {
            btn.style.fontSize = size;
        });
    }

    fontSizeSelect.addEventListener('change', (e) => {

    function loadDictCache() {

        try {

            wordStatsMap = savedStatsMap ? JSON.parse(savedStatsMap) : {};

        }

    function saveDictCache() {
        const fileKey = getCurrentFileKey();

    function getActiveWrongList() {

    function addWordToWrongList(wordObj) {
        if (!wordObj) return;
        const wordKey = wordObj.headWord || wordObj.word;
        const list = getActiveWrongList();
        const exists = list.some(w => (w.headWord || w.word) === wordKey);

    // 点击词库总体事件：手动设定初始已掌握单词数量
    dictTitleLabel.addEventListener('click', () => {
        if (isWrongMode) {
            alert("错题本模式不支持批量设置已掌握数量。");
            return;
        }

        if (!fullVocabulary || fullVocabulary.length === 0) return;

        const totalWords = fullVocabulary.length;
        let currentMastered = 0;
        fullVocabulary.forEach(item => {
            const key = item.headWord || item.word;
            if ((wordStatsMap[key] || 0) >= 3) {
                currentMastered++;
            }
        });

        const inputVal = prompt(`当前词库共有 ${totalWords} 个单词（当前已掌握 ${currentMastered} 个）。\n请输入你想要直接设定的“已掌握”单词数量 (0 - ${totalWords}):`, currentMastered);

        if (inputVal === null) return; 

        const targetMastered = parseInt(inputVal, 10);

        if (isNaN(targetMastered) || targetMastered < 0 || targetMastered > totalWords) {
            alert(`请输入有效的数量 (0 到 ${totalWords} 之间的数字)！`);
            return;
        }

        // 将前 targetMastered 个词标为已掌握(设置为3次正确)，其余单词重置为0
        fullVocabulary.forEach((item, index) => {
            const key = item.headWord || item.word;
            if (index < targetMastered) {
                wordStatsMap[key] = 3;
            } else {
                wordStatsMap[key] = 0;
            }
        });

        saveDictCache();
        setupGroupData();
        sequenceIndex = 0;
        nextWord();
    });

    // 点击当前分组事件：手工跳转分组

        const source = isWrongMode ? getActiveWrongList() : fullVocabulary;
        if (!source || source.length === 0) return;

        const inputVal = prompt(`当前共有 ${totalGroups} 组（每组 ${gSize} 个词）。\n请输入你想跳转练习的组序号 (1 - ${totalGroups}):`, currentGroupIndex + 1);

        if (inputVal === null) return; 

        const targetGroup = parseInt(inputVal, 10);

        if (isNaN(targetGroup) || targetGroup < 1 || targetGroup > totalGroups) {
            alert(`请输入有效的组序号 (1 到 ${totalGroups} 之间的数字)！`);

        currentGroupIndex = targetGroup - 1;
        saveDictCache();

        sequenceIndex = 0;

    async function fetchFileList() {
        try {
            const res = await fetch(GITHUB_API_URL);
            if (!res.ok) throw new Error("API连接异常");
            const files = await res.json();
            const jsonFiles = files.filter(f => f.name.endsWith('.json'));

            fileSelect.innerHTML = '';
            jsonFiles.forEach(file => {
                const opt = document.createElement('option');
                opt.value = file.name;
                opt.textContent = file.name;
                fileSelect.appendChild(opt);
            });

            if (jsonFiles.length > 0) loadVocabulary();
        } catch (err) {
            const fallbackFiles = ["CET4_1.json", "CET4_2.json", "CET6_1.json", "KaoYan_1.json", "GaoKao_1.json"];
            fileSelect.innerHTML = '';
            fallbackFiles.forEach(fileName => {
                const opt = document.createElement('option');
                opt.value = fileName;
                opt.textContent = fileName;
                fileSelect.appendChild(opt);
            });
            loadVocabulary();
        }
    }

    async function loadVocabulary() {
        const fileName = fileSelect.value;
        if (!fileName) return;

        isWrongMode = false;
        updateAppTitle();

        wordText.innerText = "加载中...";
        disableOptions(true);
        
        try {
            const response = await fetch(CDN_BASE_URL + fileName);
            if (!response.ok) throw new Error("网络错误");
            
            fullVocabulary = await response.json();
            
            loadDictCache();
            setupGroupData();
            
            sequenceIndex = 0;
            updateStatsUI();
            
            nextWord();
        } catch (error) {
            wordText.innerText = "加载失败";
        }
    }

    function setupGroupData() {
        const source = isWrongMode ? getActiveWrongList() : fullVocabulary;
        const gSizeVal = groupSizeSelect.value;

        if (gSizeVal === 'all') {
            currentGroupList = source;
            currentGroupIndex = 0;
        } else {
            const gSize = parseInt(gSizeVal, 10);
            const totalGroups = Math.max(1, Math.ceil(source.length / gSize));
            
            if (currentGroupIndex >= totalGroups) {
                currentGroupIndex = totalGroups - 1;
            }

            const start = currentGroupIndex * gSize;
            const end = start + gSize;
            currentGroupList = source.slice(start, end);
        }

        filterGroupVocabulary();
    }

    function filterGroupVocabulary() {
        vocabulary = currentGroupList.filter(item => {
            const key = item.headWord || item.word;
            return (wordStatsMap[key] || 0) < 3;
        });
    }

    function nextWord() {
        if (!vocabulary || vocabulary.length === 0) {
            const source = isWrongMode ? getActiveWrongList() : fullVocabulary;
            const gSizeVal = groupSizeSelect.value;

            if (gSizeVal !== 'all') {
                const gSize = parseInt(gSizeVal, 10);
                const totalGroups = Math.ceil(source.length / gSize);

                if (currentGroupIndex + 1 < totalGroups) {
                    alert(`🎉 恭喜！您已完美掌握第 ${currentGroupIndex + 1} 组的所有单词！\n即将为您自动开启第 ${currentGroupIndex + 2} 组。`);
                    currentGroupIndex++;
                    saveDictCache();
                    setupGroupData();
                    sequenceIndex = 0;
                    nextWord();
                    return;
                }
            }

            if (isWrongMode) {
                wordText.innerText = "🎉 错题本词条已全部淘汰！";
            } else {
                wordText.innerText = "🎉 当前词库已被完全通关掌握！";
            }
            disableOptions(true);
            updateStatsUI();
            return;
        }
        
        answered = false;
        isPaused = false;
        pauseBtn.innerText = "暂停";
        clearTimeout(autoTimer);
        resetOptionStyles();
        disableOptions(false);

        let targetIndex = 0;
        if (orderSelect.value === 'sequence') {
            targetIndex = sequenceIndex % vocabulary.length;
            sequenceIndex = (sequenceIndex + 1) % vocabulary.length;
        } else {
            targetIndex = Math.floor(Math.random() * vocabulary.length);
        }

        currentWordObj = vocabulary[targetIndex];

        if (studyMode === 'en2cn') {
            wordText.innerText = currentWordObj.headWord || currentWordObj.word || "Unknown";
            speakWord(() => {
                if (modeSelect.value === 'fast' && !answered && !isPaused) {
                    startAutoTimer(handleFastTimeout);
                }
            });
        } else {
            wordText.innerText = getChineseMeaning(currentWordObj);
            if (modeSelect.value === 'fast' && !answered && !isPaused) {
                startAutoTimer(handleFastTimeout);
            }
        }

        const activeWrongList = getActiveWrongList();
        const poolSource = isWrongMode ? activeWrongList : fullVocabulary;
        const pool = poolSource.length >= 4 ? poolSource : currentGroupList;
        const wrongOptions = [];
        while (wrongOptions.length < 3) {
            const rand = Math.floor(Math.random() * pool.length);
            const candidate = pool[rand];
            if (candidate !== currentWordObj && !wrongOptions.includes(candidate)) {
                wrongOptions.push(candidate);
            }
        }

        correctIndex = Math.floor(Math.random() * 4);
        let wrongOptIdx = 0;

        optionBtns.forEach((btn, i) => {
            let targetObj = (i === correctIndex) ? currentWordObj : wrongOptions[wrongOptIdx++];
            if (studyMode === 'en2cn') {
                btn.innerText = getChineseMeaning(targetObj);
            } else {
                btn.innerText = targetObj.headWord || targetObj.word || "Unknown";
            }
        });

        updateStatsUI();
    }

    function showWordDetail() {
        if (!currentWordObj) return;

        const raw = currentWordObj;
        const innerWord = raw.content?.word?.content || raw;
        const word = raw.headWord || raw.word || '未知单词';
        
        detailWordTitle.innerText = `解析: ${word}`;

        let html = '';
        const usphone = raw.usphone || innerWord.usphone;
        const ukphone = raw.ukphone || innerWord.ukphone;
        if (usphone || ukphone) {
            html += `<div class="detail-section">
                <div class="detail-title">发音</div>
                <div>
                    ${usphone ? `<span class="phonetic-tag">美 /${usphone}/</span>` : ''}
                    ${ukphone ? `<span class="phonetic-tag">英 /${ukphone}/</span>` : ''}
                </div>
            </div>`;
        }

        const trans = innerWord.trans || raw.translations;
        if (Array.isArray(trans) && trans.length > 0) {
            html += `<div class="detail-section"><div class="detail-title">释义</div>`;
            trans.forEach(t => {
                html += `<div class="trans-item">
                    ${t.pos || t.type ? `<span class="pos-badge">${t.pos || t.type}</span>` : ''}
                    <span>${t.tranCn || t.translation || ''}</span>
                </div>`;
            });
            html += `</div>`;
        } else {
            html += `<div class="detail-section"><div class="detail-title">释义</div><div>${getChineseMeaning(raw)}</div></div>`;
        }

        const phrases = innerWord.phrase?.phrases || raw.phrases;
        if (Array.isArray(phrases) && phrases.length > 0) {
            html += `<div class="detail-section"><div class="detail-title">常用短语</div>`;
            phrases.forEach(p => {
                html += `<div class="phrase-item">
                    <div class="phrase-en">${p.pContent || p.en || ''}</div>
                    <div class="phrase-cn">${p.pCn || p.cn || ''}</div>
                </div>`;
            });
            html += `</div>`;
        }

        const sentences = innerWord.sentence?.sentences || raw.sentences;
        if (Array.isArray(sentences) && sentences.length > 0) {
            html += `<div class="detail-section"><div class="detail-title">例句</div>`;
            sentences.forEach(s => {
                html += `<div class="example-item">
                    <div class="example-en">${s.sContent || s.en || ''}</div>
                    <div class="example-cn">${s.sCn || s.cn || ''}</div>
                </div>`;
            });
            html += `</div>`;
        }

        detailModalBody.innerHTML = html;
        detailModalOverlay.classList.add('active');
    }

    function togglePause() {
        if (isPaused) {
            isPaused = false;
            pauseBtn.innerText = "暂停";
            disableOptions(answered);
            if (!answered) {
                if (studyMode === 'en2cn') {
                    speakWord(() => {
                        if (modeSelect.value === 'fast') startAutoTimer(handleFastTimeout);
                    });
                } else if (modeSelect.value === 'fast') {
                    startAutoTimer(handleFastTimeout);
                }
            } else if (modeSelect.value === 'auto' || modeSelect.value === 'fast') {
                startAutoTimer(() => nextWord());
            }
        } else {
            isPaused = true;
            pauseBtn.innerText = "继续";
            clearTimeout(autoTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            disableOptions(true);
        }
    }

    function startAutoTimer(callback) {
        clearTimeout(autoTimer);
        if (isPaused) return;
        const delay = parseInt(intervalSelect.value, 10);
        autoTimer = setTimeout(callback, delay);
    }

    function handleFastTimeout() {
        if (!answered && !isPaused) {
            checkAnswer(-1); 
        }
    }

    function getChineseMeaning(item) {
        if (!item) return "无释义";
        if (item.content?.word?.content?.trans) {
            const trans = item.content.word.content.trans;
            if (Array.isArray(trans)) {
                return trans.map(t => `${t.pos || ''} ${t.tranCn || ''}`).join('; ');
            }
        }
        if (item.translations && Array.isArray(item.translations)) {
            return item.translations.map(t => `${t.type || ''} ${t.translation || ''}`).join('; ');
        }
        return item.translation || item.tranCn || item.meaning || item.chinese || "无释义";
    }

    function checkAnswer(selectedIndex) {
        if (answered || isPaused) return;
        answered = true;
        clearTimeout(autoTimer);

        stats.total++;
        const wordKey = currentWordObj.headWord || currentWordObj.word;

        if (selectedIndex === correctIndex) {
            optionBtns[selectedIndex].classList.add('correct');
            stats.correct++;
            
            wordStatsMap[wordKey] = (wordStatsMap[wordKey] || 0) + 1;

            if (wordStatsMap[wordKey] >= 3) {
                if (isWrongMode) {
                    removeWordFromWrongList(wordKey);
                }
                filterGroupVocabulary();
            }
        } else {
            if (selectedIndex >= 0) {
                optionBtns[selectedIndex].classList.add('wrong');
            }
            optionBtns[correctIndex].classList.add('correct');
            stats.wrong++;
            
            wordStatsMap[wordKey] = 0;
            if (!isWrongMode) {
                addWordToWrongList(currentWordObj);
            }
        }

        saveDictCache();
        updateStatsUI();
        disableOptions(true);

        const currentMode = modeSelect.value;
        const afterCheckCallback = () => {
            if ((currentMode === 'auto' || currentMode === 'fast') && !isPaused) {
                startAutoTimer(() => nextWord());
            }
        };

        if (studyMode === 'cn2en') {
            speakWordOnce(afterCheckCallback);
        } else {
            afterCheckCallback();
        }
    }

    function speakWordOnce(onComplete) {
        if (!('speechSynthesis' in window) || !currentWordObj) {
            if (onComplete) onComplete();
            return;
        }
        window.speechSynthesis.cancel();
        const textToSpeak = currentWordObj.headWord || currentWordObj.word;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.onend = () => { if (onComplete) onComplete(); };
        utterance.onerror = () => { if (onComplete) onComplete(); };
        window.speechSynthesis.speak(utterance);
    }

    function speakWord(onComplete) {
        if (!('speechSynthesis' in window) || !currentWordObj) {
            if (onComplete) onComplete();
            return;
        }

        window.speechSynthesis.cancel();
        const repeats = parseInt(repeatSelect.value, 10);
        const textToSpeak = currentWordObj.headWord || currentWordObj.word;
        let count = 0;

        function speak() {
            if (count < repeats && !isPaused) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                
                utterance.onend = () => {
                    count++;
                    if (count < repeats && !isPaused) setTimeout(speak, 300);
                    else if (onComplete && !isPaused) onComplete();
                };

                utterance.onerror = () => { if (onComplete) onComplete(); };

                window.speechSynthesis.speak(utterance);
            }
        }

        speak();
    }

    function updateStatsUI() {
        const activeWrongList = getActiveWrongList();
        const fullSource = isWrongMode ? activeWrongList : fullVocabulary;
        const gSizeVal = groupSizeSelect.value;

        const totalDict = fullSource.length;
        let dictMasteredCount = 0;
        fullSource.forEach(item => {
            const key = item.headWord || item.word;
            if ((wordStatsMap[key] || 0) >= 3) {
                dictMasteredCount++;
            }
        });
        const dictRemainingCount = totalDict - dictMasteredCount;

        dictTotalCountEl.innerText = totalDict;
        masteredCountEl.innerText = dictMasteredCount;
        remainingCountEl.innerText = dictRemainingCount;

        let groupTotal = 0;
        let groupMastered = 0;

        if (gSizeVal === 'all') {
            groupTitleLabel.innerText = "当前分组 (未分组)";
            groupTotal = totalDict;
            groupMastered = dictMasteredCount;
        } else {
            const gSize = parseInt(gSizeVal, 10);
            const totalGroups = Math.max(1, Math.ceil(totalDict / gSize));
            groupTitleLabel.innerText = `当前分组 (第 ${currentGroupIndex + 1}/${totalGroups} 组，点击切换)`;
            
            groupTotal = currentGroupList.length;
            currentGroupList.forEach(item => {
                const key = item.headWord || item.word;
                if ((wordStatsMap[key] || 0) >= 3) {
                    groupMastered++;
                }
            });
        }
        const groupRemaining = groupTotal - groupMastered;

        groupTotalCountEl.innerText = groupTotal;
        groupMasteredCountEl.innerText = groupMastered;
        groupRemainingCountEl.innerText = groupRemaining;

        correctCountEl.innerText = stats.correct;
        wrongCountEl.innerText = stats.wrong;
        totalCountEl.innerText = stats.total;

        updateWrongBadge();
    }

    function resetOptionStyles() {
        optionBtns.forEach(btn => btn.classList.remove('correct', 'wrong'));
    }

    function disableOptions(disabled) {
        optionBtns.forEach(btn => btn.disabled = disabled);
    }

    function handleOrderChange() {
        sequenceIndex = 0;
        nextWord();
    }

    function handleModeChange() {
        const mode = modeSelect.value;
        const isAutoOrFast = mode === 'auto' || mode === 'fast';
        intervalSelect.disabled = false; 
        
        nextBtn.style.display = isAutoOrFast ? 'none' : 'block';
        pauseBtn.style.display = isAutoOrFast ? 'block' : 'none';

        nextWord();
    }

    initTheme();
    initFontSize();
    loadSavedWrongWords();
    fetchFileList();
</script>

</body>
</html>
