<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>快速背单词</title>
    <style>
        /* 默认白天模式 (Light Mode) */
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --warning-color: #f39c12;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-secondary: #555555;
            --border-color: #e1e8ed;
            --option-bg: #ffffff;
            --score-bg: #f0f4f8;
            --modal-header-border: #eeeeee;
            --sub-text: #a0aec0;
            --btn-height: 52px;

            --option-font-size: calc(var(--btn-height) * 0.45);
            --option-font-color: var(--text-color);
        }

        /* 夜间模式 (Dark Mode) */
        [data-theme="dark"] {
            --primary-color: #5b9bd5;
            --success-color: #27ae60;
            --error-color: #c0392b;
            --warning-color: #d35400;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
            --option-bg: #2a2a2a;
            --score-bg: #252525;
            --modal-header-border: #333333;
            --sub-text: #777777;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            padding-top: calc(12px + env(safe-area-inset-top));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--text-color);
            margin: 0;
            font-size: clamp(18px, 5vw, 22px);
        }

        .settings-btn {
            background-color: var(--score-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        @media (min-width: 480px) {
            .modal-overlay {
                align-items: center;
            }
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            .modal {
                border-radius: 12px;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--modal-header-border);
            padding-bottom: 8px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 17px;
            color: var(--text-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--sub-text);
            padding: 0 8px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 40px;
            height: 38px;
            cursor: pointer;
            background: transparent;
            padding: 2px;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        select, button.control-btn {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--option-bg);
            color: var(--text-color);
            height: 42px;
        }

        .btn-group { display: flex; gap: 8px; }

        .btn-wrong-notebook {
            background-color: rgba(231, 76, 60, 0.15);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            border-radius: 8px;
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            flex: 2;
            height: 42px;
        }

        .btn-clear-wrong {
            background-color: var(--option-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            height: 42px;
        }

        .btn-clear-cache {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
            border: 1px dashed var(--error-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            height: 42px;
        }

        /* 顶部统计看板重构 */
        .score-board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: var(--score-bg);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 12px;
        }

        .stats-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stats-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
        }

        .score-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            font-weight: 600;
        }

        .score-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .score-item { text-align: center; }
        .score-total-dict { color: var(--primary-color); }
        .score-mastered { color: var(--success-color); }
        .score-remaining { color: var(--warning-color); }

        .card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 12px;
            text-align: center;
            margin-bottom: 14px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            background-color: var(--card-bg);
        }

        .word-text {
            font-size: clamp(20px, 6vw, 32px);
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 6px;
            word-break: break-word;
            line-height: 1.3;
        }

        .long-press-tip {
            font-size: 10px;
            color: var(--sub-text);
            position: absolute;
            bottom: 4px;
        }

        .speak-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary-color);
            padding: 4px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-btn {
            padding: 0 8px;
            border: 1.5px solid var(--border-color);
            background-color: var(--option-bg);
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            height: var(--btn-height);
            min-height: var(--btn-height);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.1;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: var(--option-font-size);
            color: var(--option-font-color);
        }

        .option-btn.correct {
            background-color: var(--success-color) !important;
            color: white !important;
            border-color: var(--success-color) !important;
        }

        .option-btn.wrong {
            background-color: var(--error-color) !important;
            color: white !important;
            border-color: var(--error-color) !important;
        }

        .bottom-btn-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .action-btn {
            width: 100%;
            height: 48px;
            font-size: 16px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .next-btn { background-color: var(--primary-color); }
        .pause-btn { background-color: var(--warning-color); box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3); }
        .modal-footer { margin-top: 12px; text-align: right; }

        .word-detail-body {
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-color);
            line-height: 1.5;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .detail-section {
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .detail-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
            font-size: 14px;
        }

        .phonetic-tag {
            display: inline-block;
            background: var(--score-bg);
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 6px;
        }

        .example-item {
            background-color: var(--score-bg);
            border-left: 3px solid var(--primary-color);
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: 0 4px 4px 0;
            font-size: 12px;
        }

        .example-en { font-weight: 500; color: var(--text-color); }
        .example-cn { color: var(--text-secondary); margin-top: 2px; }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <div class="header-bar">
        <h1 id="appTitle">快速背单词</h1>
        <button class="settings-btn" id="openModalBtn">⚙️ 设置</button>
    </div>

    <!-- 统计看板：重构为 本词库 与 本组 区分统计 -->
    <div class="score-board">
        <!-- 本词库统计区块 -->
        <div class="stats-block">
            <div class="stats-title">📚 本词库统计</div>
            <div class="score-row">
                <div class="score-item">总词条: <span id="dictTotalCount" class="score-total-dict">0</span></div>
                <div class="score-item">已掌握: <span id="dictMasteredCount" class="score-mastered">0</span></div>
                <div class="score-item">剩余: <span id="dictRemainingCount" class="score-remaining">0</span></div>
            </div>
        </div>

        <div class="score-divider"></div>

        <!-- 本组统计区块 -->
        <div class="stats-block">
            <div class="stats-title">
                <span>📖 本组统计</span>
                <span id="groupInfoText" style="font-size: 11px; font-weight: normal; color: var(--text-secondary);">分组加载中...</span>
            </div>
            <div class="score-row">
                <div class="score-item">总词条: <span id="groupTotalCount" class="score-total-dict">0</span></div>
                <div class="score-item">已掌握: <span id="groupMasteredCount" class="score-mastered">0</span></div>
                <div class="score-item">剩余: <span id="groupRemainingCount" class="score-remaining">0</span></div>
            </div>
        </div>
    </div>

    <div class="card" id="wordCard">
        <div id="wordText" class="word-text">正在加载...</div>
        <button id="speakBtn" class="speak-btn" title="朗读">🔊</button>
        <span class="long-press-tip">长按查看详细解析</span>
    </div>

    <div class="options-grid" id="optionsContainer">
        <button class="option-btn" onclick="checkAnswer(0)"></button>
        <button class="option-btn" onclick="checkAnswer(1)"></button>
        <button class="option-btn" onclick="checkAnswer(2)"></button>
        <button class="option-btn" onclick="checkAnswer(3)"></button>
    </div>

    <div class="bottom-btn-container">
        <button id="nextBtn" class="action-btn next-btn" onclick="nextWord()">下一题</button>
        <button id="pauseBtn" class="action-btn pause-btn" onclick="togglePause()" style="display: none;">暂停</button>
    </div>
</div>

<!-- 设置弹出窗口 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2>设置选项</h2>
            <button class="close-btn" id="closeModalBtn">✕</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="themeSelect">主题模式：</label>
                <select id="themeSelect">
                    <option value="light">☀️ 浅色模式（白天）</option>
                    <option value="dark">🌙 深色模式（夜间）</option>
                </select>
            </div>

            <div class="control-group">
                <label for="btnFontSizeSelect">按钮文字字号：</label>
                <select id="btnFontSizeSelect">
                    <option value="calc(var(--btn-height) * 0.3)">小 (30% 按钮高)</option>
                    <option value="calc(var(--btn-height) * 0.45)">默认 (45% 按钮高)</option>
                    <option value="calc(var(--btn-height) * 0.6)">中 (60% 按钮高)</option>
                    <option value="calc(var(--btn-height) * 0.75)">大 (75% 按钮高)</option>
                    <option value="calc(var(--btn-height) * 0.9)">特大 (90% 按钮高)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="btnFontColorInput">按钮文字颜色：</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="btnFontColorInput" value="#2c3e50">
                    <select id="btnFontColorSelect" style="flex: 1;">
                        <option value="default">跟随主题颜色</option>
                        <option value="#2c3e50">深蓝灰 (默认)</option>
                        <option value="#4a90e2">主题蓝</option>
                        <option value="#2ecc71">翡翠绿</option>
                        <option value="#e74c3c">珊瑚红</option>
                        <option value="#8e44ad">紫罗兰</option>
                        <option value="#000000">纯黑</option>
                        <option value="#ffffff">纯白</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="fileSelect">选择词库文件：</label>
                <select id="fileSelect">
                    <option value="">正在获取词库列表...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="groupSizeSelect">每组单词数量：</label>
                <select id="groupSizeSelect">
                    <option value="10">每组 10 个</option>
                    <option value="20" selected>每组 20 个</option>
                    <option value="50">每组 50 个</option>
                    <option value="all">不分组（全部加载）</option>
                </select>
            </div>

            <div class="control-group">
                <label for="studyTypeSelect">学习方式：</label>
                <select id="studyTypeSelect">
                    <option value="enToCn" selected>🔤 英译中 (显示英文选释义)</option>
                    <option value="cnToEn">🇨🇳 中译英 (显示中文选单词)</option>
                </select>
            </div>

            <div class="control-group">
                <label>错题本管理：</label>
                <div class="btn-group">
                    <button id="loadWrongBtn" class="btn-wrong-notebook">📖 仅加载错题本 (<span id="wrongCountBadge">0</span>)</button>
                    <button id="clearWrongBtn" class="btn-clear-wrong">清空错题</button>
                </div>
            </div>

            <div class="control-group">
                <label for="orderSelect">单词显示顺序：</label>
                <select id="orderSelect">
                    <option value="random">随机显示</option>
                    <option value="sequence">顺序显示</option>
                </select>
            </div>

            <div class="control-group">
                <label for="repeatSelect">朗读次数：</label>
                <select id="repeatSelect">
                    <option value="1">1 次</option>
                    <option value="2">2 次</option>
                    <option value="3">3 次</option>
                </select>
            </div>

            <div class="control-group">
                <label for="modeSelect">切换模式：</label>
                <select id="modeSelect">
                    <option value="manual">手动切换</option>
                    <option value="auto" selected>答题后自动切换</option>
                    <option value="fast">快速切换 (限时未答算错)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="intervalSelect">朗读后间隔时间：</label>
                <select id="intervalSelect">
                    <option value="1000" selected>1 秒</option>
                    <option value="3000">3 秒</option>
                    <option value="5000">5 秒</option>
                </select>
            </div>

            <div class="control-group" style="margin-top: 6px;">
                <label>系统数据管理：</label>
                <button id="clearCacheBtn" class="btn-clear-cache">🗑️ 清除所有本地缓存</button>
            </div>
        </div>

        <div class="modal-footer">
            <button class="action-btn next-btn" id="saveModalBtn" style="height: 40px; border-radius: 8px;">完成</button>
        </div>
    </div>
</div>

<!-- 单词详情弹出窗口 -->
<div class="modal-overlay" id="detailModalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="detailWordTitle">单词详解</h2>
            <button class="close-btn" id="closeDetailModalBtn">✕</button>
        </div>

        <div class="word-detail-body" id="detailModalBody"></div>

        <div class="modal-footer">
            <button class="action-btn next-btn" id="closeDetailBtn" style="height: 40px; border-radius: 8px;">关闭</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_API_URL = "https://api.github.com/repos/hhl760417/english-vocabulary/contents/json_original/json-full";
    const CDN_BASE_URL = "https://cdn.jsdelivr.net/gh/hhl760417/english-vocabulary@master/json_original/json-full/";

    let fullVocabulary = []; 
    let currentGroupList = []; 
    let vocabulary = []; 
    let wrongWordsList = []; 
    let wordStatsMap = {}; 
    let isWrongMode = false;

    let currentGroupIndex = 0; 
    let studyType = "enToCn"; 

    let currentWordObj = null;
    let correctIndex = -1;
    let answered = false;
    let isPaused = false;
    let autoTimer = null;
    let sequenceIndex = 0;
    let longPressTimer = null;

    let stats = { correct: 0, wrong: 0, total: 0 };

    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');

    const detailModalOverlay = document.getElementById('detailModalOverlay');
    const closeDetailModalBtn = document.getElementById('closeDetailModalBtn');
    const closeDetailBtn = document.getElementById('closeDetailBtn');
    const detailWordTitle = document.getElementById('detailWordTitle');
    const detailModalBody = document.getElementById('detailModalBody');

    const themeSelect = document.getElementById('themeSelect');
    const btnFontSizeSelect = document.getElementById('btnFontSizeSelect');
    const btnFontColorInput = document.getElementById('btnFontColorInput');
    const btnFontColorSelect = document.getElementById('btnFontColorSelect');

    const fileSelect = document.getElementById('fileSelect');
    const groupSizeSelect = document.getElementById('groupSizeSelect');
    const studyTypeSelect = document.getElementById('studyTypeSelect');
    const orderSelect = document.getElementById('orderSelect');
    const repeatSelect = document.getElementById('repeatSelect');
    const modeSelect = document.getElementById('modeSelect');
    const intervalSelect = document.getElementById('intervalSelect');
    
    const loadWrongBtn = document.getElementById('loadWrongBtn');
    const clearWrongBtn = document.getElementById('clearWrongBtn');
    const clearCacheBtn = document.getElementById('clearCacheBtn');
    const wrongCountBadge = document.getElementById('wrongCountBadge');
    const appTitle = document.getElementById('appTitle');

    const wordCard = document.getElementById('wordCard');
    const wordText = document.getElementById('wordText');
    const speakBtn = document.getElementById('speakBtn');
    const optionBtns = document.querySelectorAll('.option-btn');
    const nextBtn = document.getElementById('nextBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    /* 顶部看板 DOM 映射 */
    const groupInfoText = document.getElementById('groupInfoText');
    const dictTotalCountEl = document.getElementById('dictTotalCount');
    const dictMasteredCountEl = document.getElementById('dictMasteredCount');
    const dictRemainingCountEl = document.getElementById('dictRemainingCount');

    const groupTotalCountEl = document.getElementById('groupTotalCount');
    const groupMasteredCountEl = document.getElementById('groupMasteredCount');
    const groupRemainingCountEl = document.getElementById('groupRemainingCount');

    initTheme();
    initOptionStyleControls();
    fetchFileList();

    function initTheme() {
        const savedTheme = localStorage.getItem('app_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeSelect.value = savedTheme;
    }

    function initOptionStyleControls() {
        const savedFontSize = localStorage.getItem('app_btn_font_size');
        if (savedFontSize) {
            document.documentElement.style.setProperty('--option-font-size', savedFontSize);
            btnFontSizeSelect.value = savedFontSize;
        }

        const savedFontColor = localStorage.getItem('app_btn_font_color');
        if (savedFontColor) {
            if (savedFontColor === 'default') {
                document.documentElement.style.removeProperty('--option-font-color');
                btnFontColorSelect.value = 'default';
            } else {
                document.documentElement.style.setProperty('--option-font-color', savedFontColor);
                btnFontColorInput.value = savedFontColor;
                btnFontColorSelect.value = savedFontColor;
            }
        }
    }

    btnFontSizeSelect.addEventListener('change', (e) => {
        const fontSizeVal = e.target.value;
        document.documentElement.style.setProperty('--option-font-size', fontSizeVal);
        localStorage.setItem('app_btn_font_size', fontSizeVal);
    });

    btnFontColorInput.addEventListener('input', (e) => {
        const colorVal = e.target.value;
        document.documentElement.style.setProperty('--option-font-color', colorVal);
        btnFontColorSelect.value = colorVal;
        localStorage.setItem('app_btn_font_color', colorVal);
    });

    btnFontColorSelect.addEventListener('change', (e) => {
        const colorVal = e.target.value;
        if (colorVal === 'default') {
            document.documentElement.style.removeProperty('--option-font-color');
            localStorage.setItem('app_btn_font_color', 'default');
        } else {
            document.documentElement.style.setProperty('--option-font-color', colorVal);
            btnFontColorInput.value = colorVal;
            localStorage.setItem('app_btn_font_color', colorVal);
        }
    });

    themeSelect.addEventListener('change', (e) => {
        const selectedTheme = e.target.value;
        document.documentElement.setAttribute('data-theme', selectedTheme);
        localStorage.setItem('app_theme', selectedTheme);
    });

    function getCurrentFileKey() {
        const typeSuffix = studyType === 'cnToEn' ? '_cnToEn' : '_enToCn';
        const fileBase = isWrongMode ? 'wrong_list_mode' : (fileSelect.value || 'default');
        return fileBase + typeSuffix;
    }

    function getWrongListStorageKey() {
        return studyType === 'cnToEn' ? 'vocab_wrong_words_cnToEn' : 'vocab_wrong_words_enToCn';
    }

    function loadDictCache() {
        const fileKey = getCurrentFileKey();
        try {
            const savedStatsMap = localStorage.getItem(`vocab_stats_map_${fileKey}`);
            wordStatsMap = savedStatsMap ? JSON.parse(savedStatsMap) : {};

            const savedStats = localStorage.getItem(`vocab_session_stats_${fileKey}`);
            stats = savedStats ? JSON.parse(savedStats) : { correct: 0, wrong: 0, total: 0 };
            
            const savedGroupIdx = localStorage.getItem(`vocab_group_index_${fileKey}`);
            currentGroupIndex = savedGroupIdx ? parseInt(savedGroupIdx, 10) : 0;
        } catch (e) {
            wordStatsMap = {};
            stats = { correct: 0, wrong: 0, total: 0 };
            currentGroupIndex = 0;
        }
    }

    function saveDictCache() {
        const fileKey = getCurrentFileKey();
        localStorage.setItem(`vocab_stats_map_${fileKey}`, JSON.stringify(wordStatsMap));
        localStorage.setItem(`vocab_session_stats_${fileKey}`, JSON.stringify(stats));
        localStorage.setItem(`vocab_group_index_${fileKey}`, currentGroupIndex);
    }

    function loadSavedWrongWords() {
        try {
            const key = getWrongListStorageKey();
            const saved = localStorage.getItem(key);
            wrongWordsList = saved ? JSON.parse(saved) : [];
        } catch (e) {
            wrongWordsList = [];
        }
        updateWrongBadge();
    }

    function saveWrongWords() {
        const key = getWrongListStorageKey();
        localStorage.setItem(key, JSON.stringify(wrongWordsList));
        updateWrongBadge();
    }

    function addWordToWrongList(wordObj) {
        if (!wordObj) return;
        const wordKey = wordObj.headWord || wordObj.word;
        const exists = wrongWordsList.some(w => (w.headWord || w.word) === wordKey);
        if (!exists) {
            wrongWordsList.push(wordObj);
            saveWrongWords();
        }
    }

    function updateWrongBadge() {
        wrongCountBadge.innerText = wrongWordsList.length;
    }

    clearCacheBtn.addEventListener('click', () => {
        if (confirm("确定要清除手机上的所有缓存数据吗？（包含练习进度、错题本及主题与字体设置）")) {
            localStorage.clear();
            wordStatsMap = {};
            wrongWordsList = [];
            stats = { correct: 0, wrong: 0, total: 0 };
            currentGroupIndex = 0;

            document.documentElement.style.removeProperty('--option-font-size');
            document.documentElement.style.removeProperty('--option-font-color');
            
            initTheme();
            updateWrongBadge();
            alert("本地缓存已完全清空！");
            modalOverlay.classList.remove('active');
            loadVocabulary();
        }
    });

    openModalBtn.addEventListener('click', () => {
        loadSavedWrongWords();
        modalOverlay.classList.add('active');
    });
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    saveModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    const closeDetailModal = () => detailModalOverlay.classList.remove('active');
    closeDetailModalBtn.addEventListener('click', closeDetailModal);
    closeDetailBtn.addEventListener('click', closeDetailModal);
    detailModalOverlay.addEventListener('click', (e) => {
        if (e.target === detailModalOverlay) closeDetailModal();
    });

    function startLongPress(e) {
        if (e.target === speakBtn) return;
        longPressTimer = setTimeout(() => {
            showWordDetail();
        }, 500);
    }

    function cancelLongPress() {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
    }

    wordCard.addEventListener('mousedown', startLongPress);
    wordCard.addEventListener('mouseup', cancelLongPress);
    wordCard.addEventListener('mouseleave', cancelLongPress);

    wordCard.addEventListener('touchstart', startLongPress);
    wordCard.addEventListener('touchend', cancelLongPress);
    wordCard.addEventListener('touchmove', cancelLongPress);

    fileSelect.addEventListener('change', () => {
        isWrongMode = false;
        updateAppTitle();
        currentGroupIndex = 0;
        loadVocabulary();
    });

    groupSizeSelect.addEventListener('change', () => {
        currentGroupIndex = 0;
        setupGroupData();
        nextWord();
    });

    studyTypeSelect.addEventListener('change', () => {
        studyType = studyTypeSelect.value;
        loadSavedWrongWords();
        loadDictCache();
        updateAppTitle();
        setupGroupData();
        nextWord();
    });

    function updateAppTitle() {
        const modeName = studyType === 'cnToEn' ? '中译英' : '英译中';
        if (isWrongMode) {
            appTitle.innerText = `错题本 (${modeName})`;
        } else {
            appTitle.innerText = `背单词 (${modeName})`;
        }
    }

    loadWrongBtn.addEventListener('click', () => {
        loadSavedWrongWords();
        if (wrongWordsList.length < 4) {
            alert(`当前${studyType === 'cnToEn' ? '中译英' : '英译中'}错题本至少需要 4 个单词才能开启练习！`);
            return;
        }
        isWrongMode = true;
        updateAppTitle();
        currentGroupIndex = 0;
        loadDictCache();
        setupGroupData();
        sequenceIndex = 0;
        updateStatsUI();
        modalOverlay.classList.remove('active');
        nextWord();
    });

    clearWrongBtn.addEventListener('click', () => {
        if (confirm("确定要清空当前模式下的错题本吗？")) {
            wrongWordsList = [];
            saveWrongWords();
            if (isWrongMode) {
                isWrongMode = false;
                updateAppTitle();
                loadDictCache();
                setupGroupData();
                nextWord();
            }
        }
    });

    orderSelect.addEventListener('change', handleOrderChange);
    modeSelect.addEventListener('change', handleModeChange);
    intervalSelect.addEventListener('change', handleModeChange);
    speakBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        speakWord();
    });

    async function fetchFileList() {
        try {
            const res = await fetch(GITHUB_API_URL);
            if (!res.ok) throw new Error("API连接异常");
            const files = await res.json();
            const jsonFiles = files.filter(f => f.name.endsWith('.json'));

            fileSelect.innerHTML = '';
            jsonFiles.forEach(file => {
                const opt = document.createElement('option');
                opt.value = file.name;
                opt.textContent = file.name;
                fileSelect.appendChild(opt);
            });

            if (jsonFiles.length > 0) loadVocabulary();
        } catch (err) {
            const fallbackFiles = ["CET4_1.json", "CET4_2.json", "CET6_1.json", "KaoYan_1.json", "GaoKao_1.json"];
            fileSelect.innerHTML = '';
            fallbackFiles.forEach(fileName => {
                const opt = document.createElement('option');
                opt.value = fileName;
                opt.textContent = fileName;
                fileSelect.appendChild(opt);
            });
            loadVocabulary();
        }
    }

    async function loadVocabulary() {
        const fileName = fileSelect.value;
        if (!fileName) return;

        wordText.innerText = "加载中...";
        disableOptions(true);
        
        try {
            const response = await fetch(CDN_BASE_URL + fileName);
            if (!response.ok) throw new Error("网络错误");
            
            fullVocabulary = await response.json();
            
            loadSavedWrongWords();
            loadDictCache();
            updateAppTitle();
            setupGroupData();
            
            sequenceIndex = 0;
            updateStatsUI();
            
            nextWord();
        } catch (error) {
            wordText.innerText = "加载失败";
        }
    }

    function setupGroupData() {
        const source = isWrongMode ? wrongWordsList : fullVocabulary;
        const gSizeVal = groupSizeSelect.value;

        if (gSizeVal === 'all') {
            currentGroupList = source;
            currentGroupIndex = 0;
        } else {
            const gSize = parseInt(gSizeVal, 10);
            const totalGroups = Math.max(1, Math.ceil(source.length / gSize));
            
            if (currentGroupIndex >= totalGroups) {
                currentGroupIndex = totalGroups - 1;
            }

            const start = currentGroupIndex * gSize;
            const end = start + gSize;
            currentGroupList = source.slice(start, end);
        }

        filterGroupVocabulary();
    }

    function filterGroupVocabulary() {
        vocabulary = currentGroupList.filter(item => {
            const key = item.headWord || item.word;
            return (wordStatsMap[key] || 0) < 3;
        });
    }

    function nextWord() {
        clearTimeout(autoTimer);

        if (!vocabulary || vocabulary.length === 0) {
            const source = isWrongMode ? wrongWordsList : fullVocabulary;
            const gSizeVal = groupSizeSelect.value;

            if (gSizeVal !== 'all') {
                const gSize = parseInt(gSizeVal, 10);
                const totalGroups = Math.ceil(source.length / gSize);

                if (currentGroupIndex + 1 < totalGroups) {
                    alert(`🎉 恭喜！您已掌握第 ${currentGroupIndex + 1} 组的所有单词，即将自动进入下一组！`);
                    currentGroupIndex++;
                    saveDictCache();
                    setupGroupData();
                    nextWord();
                    return;
                }
            }
            
            wordText.innerText = "🎉 词库已全部掌握！";
            optionsContainer.style.display = "none";
            updateStatsUI();
            return;
        }

        optionsContainer.style.display = "flex";
        answered = false;
        resetOptionStyles();

        if (orderSelect.value === 'random') {
            currentWordObj = vocabulary[Math.floor(Math.random() * vocabulary.length)];
        } else {
            if (sequenceIndex >= vocabulary.length) sequenceIndex = 0;
            currentWordObj = vocabulary[sequenceIndex];
            sequenceIndex++;
        }

        const headWord = currentWordObj.headWord || currentWordObj.word;
        if (studyType === 'cnToEn') {
            wordText.innerText = getChineseTrans(currentWordObj);
            speakBtn.style.display = "none";
        } else {
            wordText.innerText = headWord;
            speakBtn.style.display = "inline-block";
            speakWord();
        }

        const sourceList = (fullVocabulary && fullVocabulary.length >= 4) ? fullVocabulary : vocabulary;
        let distractors = sourceList.filter(item => {
            const k1 = item.headWord || item.word;
            return k1 !== headWord;
        });

        distractors = shuffleArray(distractors).slice(0, 3);
        const choices = shuffleArray([currentWordObj, ...distractors]);

        correctIndex = choices.findIndex(item => (item.headWord || item.word) === headWord);

        optionBtns.forEach((btn, idx) => {
            btn.disabled = false;
            if (studyType === 'cnToEn') {
                btn.innerText = choices[idx].headWord || choices[idx].word;
            } else {
                btn.innerText = getChineseTrans(choices[idx]);
            }
        });

        updateStatsUI();

        if (modeSelect.value === 'fast' && !isPaused) {
            autoTimer = setTimeout(() => {
                if (!answered) checkAnswer(-1); 
            }, 4000);
        }
    }

    function checkAnswer(selectedIndex) {
        if (answered) return;
        answered = true;
        clearTimeout(autoTimer);

        const wordKey = currentWordObj.headWord || currentWordObj.word;

        if (selectedIndex === correctIndex) {
            if (selectedIndex >= 0) optionBtns[selectedIndex].classList.add('correct');
            stats.correct++;

            wordStatsMap[wordKey] = (wordStatsMap[wordKey] || 0) + 1;
            if (wordStatsMap[wordKey] >= 3) {
                filterGroupVocabulary();
            }
        } else {
            if (selectedIndex >= 0) optionBtns[selectedIndex].classList.add('wrong');
            optionBtns[correctIndex].classList.add('correct');
            stats.wrong++;

            wordStatsMap[wordKey] = 0;
            addWordToWrongList(currentWordObj);
        }

        speakWord();

        stats.total++;
        saveDictCache();
        updateStatsUI();
        disableOptions(true);

        if (modeSelect.value !== 'manual' && !isPaused) {
            const delay = parseInt(intervalSelect.value, 10) || 1000;
            autoTimer = setTimeout(() => {
                nextWord();
            }, delay);
        }
    }

    /* 重新实现的统计 UI 函数，精确区分词库和当前组数据 */
    function updateStatsUI() {
        const fullSource = isWrongMode ? wrongWordsList : fullVocabulary;
        const dictTotal = fullSource.length;

        // 1. 本词库统计
        let dictMastered = 0;
        fullSource.forEach(item => {
            const key = item.headWord || item.word;
            if ((wordStatsMap[key] || 0) >= 3) dictMastered++;
        });

        dictTotalCountEl.innerText = dictTotal;
        dictMasteredCountEl.innerText = dictMastered;
        dictRemainingCountEl.innerText = Math.max(0, dictTotal - dictMastered);

        // 2. 本组统计
        const gSizeVal = groupSizeSelect.value;
        let totalGroups = 1;

        if (gSizeVal !== 'all') {
            const gSize = parseInt(gSizeVal, 10);
            totalGroups = Math.max(1, Math.ceil(dictTotal / gSize));
        }

        groupInfoText.innerText = `第 ${currentGroupIndex + 1} / ${totalGroups} 组`;

        const groupTotal = currentGroupList.length;
        let groupMastered = 0;

        currentGroupList.forEach(item => {
            const key = item.headWord || item.word;
            if ((wordStatsMap[key] || 0) >= 3) groupMastered++;
        });

        groupTotalCountEl.innerText = groupTotal;
        groupMasteredCountEl.innerText = groupMastered;
        groupRemainingCountEl.innerText = Math.max(0, groupTotal - groupMastered);
    }

    function getChineseTrans(wordObj) {
        if (!wordObj) return "暂无释义";

        if (wordObj.trans && Array.isArray(wordObj.trans) && wordObj.trans.length > 0) {
            return wordObj.trans.map(t => `${t.pos || t.p || ''} ${t.tranCn || t.cn || t.translation || ''}`.trim()).filter(Boolean).join('；');
        }

        if (wordObj.translations && Array.isArray(wordObj.translations) && wordObj.translations.length > 0) {
            return wordObj.translations.map(t => `${t.type || t.pos || ''} ${t.translation || t.tranCn || ''}`.trim()).filter(Boolean).join('；');
        }

        const nestedTrans = wordObj.content?.word?.content?.trans;
        if (nestedTrans && Array.isArray(nestedTrans) && nestedTrans.length > 0) {
            return nestedTrans.map(t => `${t.pos || ''} ${t.tranCn || t.cn || ''}`.trim()).filter(Boolean).join('；');
        }

        if (typeof wordObj.translation === 'string' && wordObj.translation) return wordObj.translation;
        if (typeof wordObj.tranCn === 'string' && wordObj.tranCn) return wordObj.tranCn;
        if (typeof wordObj.cn === 'string' && wordObj.cn) return wordObj.cn;

        return "暂无释义";
    }

    function speakWord() {
        if (!currentWordObj) return;
        const text = currentWordObj.headWord || currentWordObj.word;
        if (!text) return;

        window.speechSynthesis.cancel();
        const repeatCount = parseInt(repeatSelect.value, 10) || 1;

        for (let i = 0; i < repeatCount; i++) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function resetOptionStyles() {
        optionBtns.forEach(btn => {
            btn.classList.remove('correct', 'wrong');
            btn.disabled = false;
        });
    }

    function disableOptions(disabled) {
        optionBtns.forEach(btn => btn.disabled = disabled);
    }

    function handleOrderChange() {
        sequenceIndex = 0;
        nextWord();
    }

    function handleModeChange() {
        intervalSelect.disabled = (modeSelect.value === 'manual');
        if (modeSelect.value === 'fast') {
            pauseBtn.style.display = 'inline-block';
            nextBtn.style.width = '48%';
            pauseBtn.style.width = '48%';
        } else {
            pauseBtn.style.display = 'none';
            nextBtn.style.width = '100%';
        }
    }

    function togglePause() {
        isPaused = !isPaused;
        pauseBtn.innerText = isPaused ? "继续" : "暂停";
        if (!isPaused && !answered) {
            nextWord();
        }
    }

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function showWordDetail() {
        if (!currentWordObj) return;
        const word = currentWordObj.headWord || currentWordObj.word;
        detailWordTitle.innerText = word;

        let html = '';

        const usphone = currentWordObj.content?.word?.content?.phone || currentWordObj.usphone;
        const ukphone = currentWordObj.ukphone;

        if (usphone || ukphone) {
            html += `<div class="detail-section">`;
            if (usphone) html += `<span class="phonetic-tag">美 /${usphone}/</span>`;
            if (ukphone) html += `<span class="phonetic-tag">英 /${ukphone}/</span>`;
            html += `</div>`;
        }

        html += `<div class="detail-section"><div class="detail-title">详细释义：</div>`;
        html += `<div>${getChineseTrans(currentWordObj)}</div>`;
        html += `</div>`;

        const sentences = currentWordObj.content?.word?.content?.sentence?.sentences;
        if (sentences && Array.isArray(sentences) && sentences.length > 0) {
            html += `<div class="detail-section"><div class="detail-title">经典例句：</div>`;
            sentences.slice(0, 3).forEach(s => {
                html += `<div class="example-item">
                    <div class="example-en">${s.sContent}</div>
                    <div class="example-cn">${s.sCn}</div>
                </div>`;
            });
            html += `</div>`;
        }

        detailModalBody.innerHTML = html;
        detailModalOverlay.classList.add('active');
    }
</script>
